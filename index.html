<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>아큐브 난시 체험</title>
  <style>
    :root{
      --acuvue-blue:#005EB8;
      --acuvue-blue-2:#1E78D6;
      --text-navy:#1e293b;
      --line:#dbe4f0;
      --bg:#edf5fd;
      --shadow:0 24px 70px rgba(15,23,42,.20);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;background:linear-gradient(180deg,#f7fbff 0%,#edf5fd 48%,#e8f1fb 100%);overflow:hidden;color:var(--text-navy)}
    .page{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
    .hero-btn{
      border:none;border-radius:999px;background:linear-gradient(180deg,#0f6bd7 0%,#005EB8 100%);color:#fff;
      height:62px;padding:0 28px;font-size:20px;font-weight:900;letter-spacing:-.02em;
      box-shadow:0 18px 34px rgba(0,94,184,.24);cursor:pointer
    }
    .hero-btn:active{transform:scale(.98)}

    #asdOverlay{position:fixed;inset:0;z-index:20;display:none;background:rgba(11,31,51,.18);backdrop-filter:blur(10px);padding:18px;align-items:center;justify-content:center}
    #asdOverlay.show{display:flex}
    #asdCard{width:min(560px,97vw);border-radius:40px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
    #asdHeader{display:flex;justify-content:space-between;align-items:center;padding:24px 24px 12px;background:#fff}
    #asdHeaderTitle{font-size:24px;line-height:1.14;font-weight:900;letter-spacing:-.03em}
    #asdHeaderSubTitle{margin-top:4px;font-size:11px;color:#94a3b8;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    #asdClose{width:40px;height:40px;border:none;border-radius:999px;background:#f8fafc;color:#94a3b8;font-weight:800;font-size:20px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(148,163,184,.16)}

    #asdScene{position:relative;width:calc(100% - 32px);margin:0 16px;aspect-ratio:1/1;min-height:360px;border-radius:32px;overflow:hidden;background:#dfe7f1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
    #rearVideo,#rearCapture,#eyeFallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    #rearVideo{opacity:0;transition:opacity .2s ease,filter .25s ease;background:#dfe7f1}
    #rearVideo.ready{opacity:1}
    #rearCapture{display:none;filter:blur(6px) saturate(.95);transition:filter .35s ease, opacity .25s ease}
    #eyeFallback{background:#dfe7f1}
    #eyeFallback img{width:100%;height:100%;object-fit:cover;display:block}

    #asdGuide{position:absolute;inset:0;pointer-events:none;z-index:3}
    #asdGuideCircle{position:absolute;left:50%;top:52%;width:80%;height:80%;transform:translate(-50%,-50%);border-radius:999px;border:2px solid rgba(71,125,190,.30)}
    #asdGuideAxis{position:absolute;left:10%;right:10%;top:52%;border-top:3px dashed rgba(68,67,73,.55);transform-origin:center;transition:transform .18s ease}
    .guideSide{position:absolute;width:8.8%;height:17.5%;border-radius:999px;background:linear-gradient(180deg, rgba(34,211,238,.26), rgba(56,189,248,.14));box-shadow:inset 0 0 0 1px rgba(56,189,248,.14),0 0 14px rgba(14,165,233,.10);opacity:.86;transform:translate(-50%,-50%)}
    #asdGuideSideLeft{left:18.5%;top:52%}
    #asdGuideSideRight{left:81.5%;top:52%}
    .asdGuideDot{position:absolute;width:18px;height:18px;border-radius:999px;background:#f59e0b;box-shadow:0 0 0 8px rgba(245,158,11,.10),0 4px 10px rgba(245,158,11,.35);transform:translate(-50%,-50%);transition:left .18s ease, top .18s ease, background .18s ease, box-shadow .18s ease}
    #asdGuideDotLeft{left:10%;top:52%}
    #asdGuideDotRight{left:90%;top:52%}
    #asdOverlay.asd-stable .asdGuideDot{background:#22c55e;box-shadow:0 0 0 8px rgba(34,197,94,.12),0 4px 10px rgba(34,197,94,.30)}

    #asdLensImg{position:absolute;left:50%;top:52%;width:80%;transform:translate(calc(-50% - 4px),calc(-50% + 10px)) rotate(20deg);opacity:.70;pointer-events:none;z-index:2;filter:saturate(1.08) contrast(1.06)}
    #asdUpperLid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transform:scale(1.55) translateY(3px);transform-origin:center;z-index:4;filter:drop-shadow(0 2px 10px rgba(0,0,0,.18))}
    #asdBlinkLid{position:absolute;inset:0;pointer-events:none;z-index:5}
    #asdLidTop,#asdLidBot{position:absolute;left:0;right:0;height:55%;background: radial-gradient(120% 90% at 50% 85%, rgba(165,120,95,.98) 0%, rgba(120,80,62,.98) 46%, rgba(40,25,22,.98) 92%);opacity:0;transform:translateY(-110%)}
    #asdLidBot{top:auto;bottom:0;background: radial-gradient(120% 90% at 50% 15%, rgba(165,120,95,.98) 0%, rgba(120,80,62,.98) 46%, rgba(40,25,22,.98) 92%);transform:translateY(110%)}
    #asdAngleBadge{position:absolute;left:18px;bottom:18px;z-index:6;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.90);color:#2563eb;border:1px solid rgba(59,130,246,.16);font-size:14px;font-weight:900;box-shadow:0 12px 30px rgba(15,23,42,.18);backdrop-filter:blur(10px)}
    #asdAngleBadge::before{content:"";width:10px;height:10px;border-radius:999px;background:currentColor;box-shadow:0 0 0 5px rgba(59,130,246,.10)}

    #rotateFloating{position:absolute;left:18px;top:18px;z-index:7;height:42px;padding:0 14px;border:none;border-radius:999px;background:rgba(255,255,255,.92);color:#2563eb;font-weight:900;font-size:14px;box-shadow:0 10px 24px rgba(15,23,42,.14);cursor:pointer}
    #rotateFloating:active{transform:scale(.98)}

    #frontPip{position:absolute;right:22px;top:22px;z-index:8;width:34%;aspect-ratio:3/4;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.88);box-shadow:0 16px 34px rgba(15,23,42,.22);display:none;border:2px solid rgba(255,255,255,.7)}
    #frontPip video{width:100%;height:100%;object-fit:cover;display:block}
    #frontGuide{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);min-height:40px;padding:0 16px;border-radius:999px;background:#2d6cf0;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;box-shadow:0 10px 20px rgba(37,99,235,.26)}
    #frontGuide:active{transform:translateX(-50%) scale(.98)}
    #blinkPrompt{position:absolute;left:24px;top:26px;z-index:8;display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.92);border:2px solid rgba(110,155,230,.62);color:#2455C7;font-size:15px;font-weight:900;box-shadow:0 10px 20px rgba(15,23,42,.14)}
    #blinkPrompt::before{content:"";width:12px;height:12px;border-radius:999px;background:#2455C7;box-shadow:0 0 0 6px rgba(36,85,199,.08)}

    #asdControlBar{display:flex;align-items:center;gap:10px;padding:14px 16px 16px;background:#fff}
    .asdActionBtn{flex:1 1 0;height:56px;border-radius:20px;border:1px solid rgba(148,163,184,.18);background:#fff;color:#1e293b;font-size:16px;font-weight:900;box-shadow:0 8px 20px rgba(15,23,42,.08);cursor:pointer}
    .asdActionBtn:active{transform:scale(.98)}
    #asdManualBtn{background:#fff;color:#2563eb}
    #asdAutoBtn{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 14px 26px rgba(37,99,235,.16)}

    @media (max-width:560px){
      #asdOverlay{padding:8px}
      #asdCard{width:100%;border-radius:30px}
      #asdHeader{padding:20px 18px 10px}
      #asdHeaderTitle{font-size:20px}
      #asdHeaderSubTitle{font-size:10px}
      #asdClose{width:36px;height:36px;font-size:18px}
      #asdScene{width:calc(100% - 20px);margin:0 10px;min-height:320px;border-radius:26px}
      #asdAngleBadge{left:14px;bottom:14px;padding:8px 12px;font-size:11px}
      #rotateFloating{left:14px;top:14px;height:38px;font-size:12px;padding:0 12px}
      #blinkPrompt{left:14px;top:14px;font-size:12px;padding:8px 12px}
      #frontPip{right:14px;top:18px;width:33%;border-radius:24px}
      #frontGuide{bottom:14px;font-size:11px;padding:0 12px;min-height:36px}
      #asdControlBar{padding:12px 10px 12px;gap:8px}
      .asdActionBtn{height:48px;font-size:13px;border-radius:16px}
    }
  </style>
</head>
<body>
  <div class="page">
    <button class="hero-btn" id="openExperienceBtn" type="button">아큐브 난시 체험</button>
  </div>

  <div id="asdOverlay" aria-hidden="true">
    <div id="asdCard">
      <div id="asdHeader">
        <div>
          <div id="asdHeaderTitle">ASD™ 축안정화</div>
          <div id="asdHeaderSubTitle">ACCELERATION STABLE DESIGN</div>
        </div>
        <button id="asdClose" type="button">X</button>
      </div>

      <div id="asdScene">
        <div id="eyeFallback"><img src="a.png" alt="eye" onerror="this.src='a.gif'"></div>
        <video id="rearVideo" autoplay playsinline muted></video>
        <img id="rearCapture" alt="rear capture">

        <div id="asdGuide">
          <div id="asdGuideCircle"></div>
          <div id="asdGuideSideLeft" class="guideSide"></div>
          <div id="asdGuideSideRight" class="guideSide"></div>
          <div id="asdGuideAxis"></div>
          <div id="asdGuideDotLeft" class="asdGuideDot"></div>
          <div id="asdGuideDotRight" class="asdGuideDot"></div>
        </div>

        <img id="asdLensImg" src="lens.png" alt="lens" onerror="this.style.display='none'">
        <img id="asdUpperLid" src="upper_lid.png" alt="upper lid" onerror="this.style.display='none'">
        <div id="asdBlinkLid"><div id="asdLidTop"></div><div id="asdLidBot"></div></div>

        <button id="rotateFloating" type="button">축이탈</button>
        <div id="blinkPrompt">눈을 한 번 깜박여 주세요</div>
        <div id="frontPip">
          <video id="frontVideo" autoplay playsinline muted></video>
          <button id="frontGuide" type="button">눈 한번 깜박여 주세요</button>
        </div>

        <div id="asdAngleBadge">좌측 20° 회전 발생</div>
      </div>

      <div id="asdControlBar">
        <button id="asdManualBtn" class="asdActionBtn" type="button">깜박임 수동</button>
        <button id="asdAutoBtn" class="asdActionBtn" type="button">깜박임 자동인식</button>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openExperienceBtn');
    const asdOverlay = document.getElementById('asdOverlay');
    const asdClose = document.getElementById('asdClose');
    const rearVideo = document.getElementById('rearVideo');
    const frontVideo = document.getElementById('frontVideo');
    const rearCapture = document.getElementById('rearCapture');
    const eyeFallback = document.getElementById('eyeFallback');
    const asdLensImg = document.getElementById('asdLensImg');
    const asdGuideAxis = document.getElementById('asdGuideAxis');
    const asdGuideCircle = document.getElementById('asdGuideCircle');
    const asdGuideDotLeft = document.getElementById('asdGuideDotLeft');
    const asdGuideDotRight = document.getElementById('asdGuideDotRight');
    const asdAngleBadge = document.getElementById('asdAngleBadge');
    const asdManualBtn = document.getElementById('asdManualBtn');
    const asdAutoBtn = document.getElementById('asdAutoBtn');
    const rotateFloating = document.getElementById('rotateFloating');
    const frontPip = document.getElementById('frontPip');
    const frontGuide = document.getElementById('frontGuide');
    const blinkPrompt = document.getElementById('blinkPrompt');
    const asdLidTop = document.getElementById('asdLidTop');
    const asdLidBot = document.getElementById('asdLidBot');

    let rearStream = null;
    let frontStream = null;
    let angle = 20;
    let autoMode = false;
    let blinkBusy = false;

    const STEP = 5;

    function randomAngle(){
      const values = [-25,-20,-15,-10,10,15,20,25];
      return values[Math.floor(Math.random()*values.length)];
    }

    function renderGuide(){
      if(asdGuideAxis) asdGuideAxis.style.transform = `rotate(${angle}deg)`;
      if(asdGuideCircle) asdGuideCircle.style.transform = `translate(-50%,-50%) rotate(${(angle * 0.18).toFixed(2)}deg)`;
      const cx = 50, cy = 52, outer = 40;
      const rad = angle * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      const lx = cx - outer*cos, ly = cy - outer*sin;
      const rx = cx + outer*cos, ry = cy + outer*sin;
      asdGuideDotLeft.style.left = `${lx}%`;
      asdGuideDotLeft.style.top = `${ly}%`;
      asdGuideDotRight.style.left = `${rx}%`;
      asdGuideDotRight.style.top = `${ry}%`;

      if(asdLensImg){
        asdLensImg.style.transform = `translate(calc(-50% - 4px), calc(-50% + 10px)) rotate(${angle}deg)`;
      }
      if(angle > 0) asdAngleBadge.textContent = `좌측 ${Math.abs(angle)}° 회전 발생`;
      else if(angle < 0) asdAngleBadge.textContent = `우측 ${Math.abs(angle)}° 회전 발생`;
      else asdAngleBadge.textContent = '축 안정';
      asdOverlay.classList.toggle('asd-stable', Math.abs(angle) === 0);

      if(rearVideo.classList.contains('ready')){
        const blur = Math.min(8, Math.abs(angle)*0.16);
        rearVideo.style.filter = Math.abs(angle) === 0 ? 'blur(0px) saturate(1.02) brightness(1.02)' : `blur(${blur.toFixed(2)}px) saturate(.92)`;
      }
      if(rearCapture.style.display === 'block'){
        const blur = Math.min(8, Math.abs(angle)*0.16);
        rearCapture.style.filter = Math.abs(angle) === 0 ? 'blur(0px) saturate(1.02) brightness(1.02)' : `blur(${blur.toFixed(2)}px) saturate(.92)`;
      }
    }

    function triggerBlink(){
      if(blinkBusy) return;
      blinkBusy = true;
      asdLidTop.animate([
        { opacity:0, transform:'translateY(-110%)' },
        { opacity:1, transform:'translateY(0%)', offset:.45 },
        { opacity:0, transform:'translateY(-110%)' }
      ], { duration:520, easing:'ease-in-out' });
      asdLidBot.animate([
        { opacity:0, transform:'translateY(110%)' },
        { opacity:1, transform:'translateY(0%)', offset:.45 },
        { opacity:0, transform:'translateY(110%)' }
      ], { duration:520, easing:'ease-in-out' });
      setTimeout(()=> blinkBusy = false, 560);
    }

    function stabilizeStep(){
      if(angle === 0) return;
      triggerBlink();
      if(angle > 0) angle = Math.max(0, angle - STEP);
      else angle = Math.min(0, angle + STEP);
      renderGuide();
    }

    async function startRearCamera(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try{
        if(rearStream) rearStream.getTracks().forEach(t=>t.stop());
        rearStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
        rearVideo.srcObject = rearStream;
        rearVideo.onloadedmetadata = ()=>{
          rearVideo.classList.add('ready');
          rearVideo.play().catch(()=>{});
          eyeFallback.style.display = 'none';
        };
      }catch(e){
        eyeFallback.style.display = 'block';
      }
    }

    async function startFrontCamera(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
      try{
        if(frontStream) frontStream.getTracks().forEach(t=>t.stop());
        frontStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
        frontVideo.srcObject = frontStream;
        frontVideo.onloadedmetadata = ()=> frontVideo.play().catch(()=>{});
        frontPip.style.display = 'block';
        blinkPrompt.style.display = 'inline-flex';
        return true;
      }catch(e){
        frontPip.style.display = 'none';
        blinkPrompt.style.display = 'none';
        return false;
      }
    }

    function stopFrontCamera(){
      if(frontStream){
        frontStream.getTracks().forEach(t=>t.stop());
        frontStream = null;
      }
      frontVideo.srcObject = null;
      frontPip.style.display = 'none';
      blinkPrompt.style.display = 'none';
    }

    function captureRearFrame(){
      if(!rearVideo.videoWidth || !rearVideo.videoHeight) return false;
      const canvas = document.createElement('canvas');
      canvas.width = rearVideo.videoWidth;
      canvas.height = rearVideo.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(rearVideo,0,0,canvas.width,canvas.height);
      rearCapture.src = canvas.toDataURL('image/jpeg', .92);
      rearCapture.style.display = 'block';
      rearVideo.style.opacity = '0';
      return true;
    }

    function resetState(){
      autoMode = false;
      angle = 20;
      rearCapture.style.display = 'none';
      rearVideo.style.opacity = rearVideo.classList.contains('ready') ? '1' : '0';
      stopFrontCamera();
      renderGuide();
    }

    openBtn.addEventListener('click', async ()=>{
      asdOverlay.classList.add('show');
      asdOverlay.setAttribute('aria-hidden','false');
      resetState();
      await startRearCamera();
      renderGuide();
    });

    asdClose.addEventListener('click', ()=>{
      asdOverlay.classList.remove('show');
      asdOverlay.setAttribute('aria-hidden','true');
      stopFrontCamera();
      if(rearStream){ rearStream.getTracks().forEach(t=>t.stop()); rearStream = null; }
      rearVideo.srcObject = null;
      rearVideo.classList.remove('ready');
      rearVideo.style.opacity = '0';
      eyeFallback.style.display = 'block';
      rearCapture.style.display = 'none';
    });

    rotateFloating.addEventListener('click', ()=>{
      angle = randomAngle();
      renderGuide();
    });

    asdManualBtn.addEventListener('click', stabilizeStep);

    asdAutoBtn.addEventListener('click', async ()=>{
      autoMode = true;
      if(!rearVideo.classList.contains('ready')) await startRearCamera();
      captureRearFrame();
      await startFrontCamera();
    });

    frontGuide.addEventListener('click', ()=>{
      if(!autoMode) return;
      stabilizeStep();
    });

    renderGuide();
  </script>
</body>
</html>
