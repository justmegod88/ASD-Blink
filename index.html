
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>아큐브 난시 체험</title>
  <style>
    :root{ --blue:#2563eb; --blue-deep:#1d4ed8; --text:#1e293b; --sub:#94a3b8; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;background:linear-gradient(180deg,#f7fbff 0%,#edf5ff 100%);overflow:hidden}
    .landing{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(60% 26% at 50% 18%, rgba(37,99,235,.22), rgba(37,99,235,0) 60%), linear-gradient(180deg,#f7fbff 0%,#edf5ff 100%); z-index:1;}
    .cta{border:none; border-radius:22px; padding:18px 28px; min-width:220px; font-size:20px; font-weight:900; color:#fff; cursor:pointer; background:linear-gradient(180deg,var(--blue) 0%, var(--blue-deep) 100%); box-shadow:0 22px 44px rgba(37,99,235,.24);}
    .overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:14px; background:rgba(20,30,48,.18); backdrop-filter:blur(10px); z-index:20;}
    .overlay.show{display:flex}
    .card{width:min(720px,96vw); background:#fff; border-radius:34px; overflow:hidden; box-shadow:0 24px 60px rgba(15,23,42,.18); border:1px solid rgba(15,23,42,.06);}
    .head{display:flex; justify-content:space-between; align-items:flex-start; padding:22px 22px 10px}
    .head h1{margin:0; font-size:24px; line-height:1.15; font-weight:900; letter-spacing:-.03em; color:var(--text)}
    .sub{margin-top:4px; color:var(--sub); font-size:11px; font-weight:800; letter-spacing:.16em}
    .close{width:42px; height:42px; border:none; border-radius:999px; background:#f8fafc; color:#94a3b8; font-size:20px; font-weight:900; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(148,163,184,.18);}
    .scene{position:relative; margin:0 16px; border-radius:30px; overflow:hidden; aspect-ratio:1/1; min-height:360px; background:#dfe8f5; box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);}
    .scene > *{position:absolute; inset:0}
    #rearVideo,#capturedRear{width:100%; height:100%; object-fit:cover; background:#dfe8f5; display:block}
    #capturedRear{display:none}
    .blurLayer{pointer-events:none; backdrop-filter: blur(var(--blur,0px)); -webkit-backdrop-filter: blur(var(--blur,0px)); z-index:2}
    .graphics{z-index:3; pointer-events:none}
    .circle{position:absolute; left:50%; top:52%; width:80%; height:80%; transform:translate(-50%,-50%); border-radius:999px; border:2px solid rgba(82,126,193,.28);}
    .axis{position:absolute; left:10%; right:10%; top:52%; border-top:4px dashed rgba(68,67,73,.42); transform-origin:center; transition:transform .35s ease;}
    .side{position:absolute; width:8.8%; height:17.5%; border-radius:999px; background:linear-gradient(180deg, rgba(34,211,238,.24), rgba(56,189,248,.12)); box-shadow:inset 0 0 0 1px rgba(56,189,248,.18);}
    .side.left{left:18.5%; top:52%; transform:translate(-50%,-50%)}
    .side.right{left:81.5%; top:52%; transform:translate(-50%,-50%)}
    .dot{position:absolute; width:18px; height:18px; border-radius:999px; background:#f59e0b; box-shadow:0 0 0 8px rgba(245,158,11,.12), 0 4px 10px rgba(245,158,11,.35);}
    .dot.left{left:10%; top:52%; transform:translate(-50%,-50%)}
    .dot.right{left:90%; top:52%; transform:translate(-50%,-50%)}
    .badge{position:absolute; left:16px; bottom:16px; z-index:4; display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:999px; background:rgba(255,255,255,.92); color:var(--blue); border:1px solid rgba(59,130,246,.18); box-shadow:0 10px 24px rgba(15,23,42,.12); font-size:14px; font-weight:900;}
    .badge:before{content:""; width:10px; height:10px; border-radius:999px; background:currentColor; box-shadow:0 0 0 5px rgba(59,130,246,.10)}
    .guide{position:absolute; left:18px; top:18px; z-index:5; display:none; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; background:rgba(255,255,255,.94); color:var(--blue); font-size:15px; font-weight:900; border:1.5px solid rgba(110,155,230,.85); box-shadow:0 10px 18px rgba(11,31,51,.12);}
    .guide.show{display:inline-flex}
    .guide:before{content:""; width:10px; height:10px; border-radius:999px; background:currentColor; box-shadow:0 0 0 5px rgba(59,130,246,.10)}
    .frontInset{position:absolute; right:18px; top:26px; width:33%; aspect-ratio:3/4; border-radius:24px; overflow:hidden; border:2px solid rgba(255,255,255,.85); box-shadow:0 12px 26px rgba(15,23,42,.18); z-index:5; display:none; background:#e5edf8;}
    .frontInset.show{display:block}
    .frontInset video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1)}
    .frontInset .label{position:absolute; left:12px; right:12px; bottom:12px; z-index:2; padding:10px 14px; text-align:center; border-radius:999px; background:rgba(37,99,235,.92); color:#fff; font-size:13px; font-weight:900; box-shadow:0 8px 18px rgba(37,99,235,.22);}
    .controls{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 16px 16px; background:#fff}
    .btn{height:56px; border-radius:20px; border:1px solid rgba(148,163,184,.18); background:#fff; color:var(--text); font-size:16px; font-weight:900; cursor:pointer; box-shadow:0 8px 20px rgba(15,23,42,.08);}
    .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 14px 26px rgba(37,99,235,.16)}
    .btn.active{background:#eff6ff; color:var(--blue); border-color:rgba(37,99,235,.2)}
    .footer{padding:0 18px 18px; background:#fff; color:#475569; font-size:14px; line-height:1.55}
    .footer .title{font-size:16px; font-weight:900; color:#1e293b; margin-bottom:4px}
    .footer .blue{color:var(--blue); font-weight:800}
    @media (max-width:560px){
      .card{border-radius:28px} .head{padding:18px 18px 8px} .head h1{font-size:20px} .close{width:38px;height:38px}
      .scene{margin:0 10px; min-height:320px; border-radius:26px} .badge{left:14px; bottom:14px; font-size:12px; padding:8px 12px}
      .guide{left:14px; top:14px; font-size:13px; padding:9px 13px; max-width:60%} .controls{padding:12px 10px}
      .btn{height:48px; font-size:13px; border-radius:16px} .footer{padding:0 14px 14px; font-size:13px}
      .frontInset{width:34%; right:14px; top:22px; border-radius:20px} .frontInset .label{font-size:12px; left:10px; right:10px; bottom:10px; padding:8px 10px}
    }
  </style>
</head>
<body>
  <div class="landing" id="landing"><button class="cta" id="openDemo">아큐브 난시 체험</button></div>
  <div class="overlay" id="overlay">
    <div class="card">
      <div class="head">
        <div><h1>ASD™ 축안정화</h1><div class="sub">ACCELERATION STABLE DESIGN</div></div>
        <button class="close" id="closeDemo">X</button>
      </div>

      <div class="scene">
        <video id="rearVideo" autoplay playsinline muted></video>
        <img id="capturedRear" alt="">
        <div class="blurLayer" id="blurLayer"></div>
        <div class="graphics">
          <div class="circle"></div>
          <div class="axis" id="axis"></div>
          <div class="side left"></div>
          <div class="side right"></div>
          <div class="dot left"></div>
          <div class="dot right"></div>
        </div>
        <div class="guide" id="guide">눈을 한 번 깜박여 주세요</div>
        <div class="frontInset" id="frontInset">
          <video id="frontVideo" autoplay playsinline muted></video>
          <div class="label">눈을 한 번 깜박여 주세요</div>
        </div>
        <div class="badge" id="angleBadge">좌측 20° 회전 발생</div>
      </div>

      <div class="controls">
        <button class="btn" id="rotateBtn">축이탈</button>
        <button class="btn primary" id="manualBtn">깜박임 수동</button>
        <button class="btn" id="autoBtn">깜박임 자동인식</button>
      </div>

      <div class="footer">
        <div class="title">난시 렌즈는 축이 회전되면 시야가 흐려집니다.</div>
        <div><span class="blue">수동</span>은 카메라가 켜진 상태에서 클릭할 때마다 5도씩 안정화되고, <span class="blue">자동인식</span>은 후면 화면을 캡처한 뒤 전면 카메라를 보여주며 자동으로 5도씩 안정화됩니다.</div>
      </div>
    </div>
  </div>

<script>
const openDemo = document.getElementById("openDemo");
const closeDemo = document.getElementById("closeDemo");
const overlay = document.getElementById("overlay");
const rearVideo = document.getElementById("rearVideo");
const frontVideo = document.getElementById("frontVideo");
const frontInset = document.getElementById("frontInset");
const capturedRear = document.getElementById("capturedRear");
const rotateBtn = document.getElementById("rotateBtn");
const manualBtn = document.getElementById("manualBtn");
const autoBtn = document.getElementById("autoBtn");
const axis = document.getElementById("axis");
const angleBadge = document.getElementById("angleBadge");
const blurLayer = document.getElementById("blurLayer");
const guide = document.getElementById("guide");

let rearStream = null, frontStream = null, angle = -20, autoMode = false, autoTick = null;

function randomAngle(){ const list=[-25,-20,-15,15,20,25]; return list[Math.floor(Math.random()*list.length)]; }
function updateScene(){
  axis.style.transform = `rotate(${angle}deg)`;
  const dir = angle < 0 ? "좌측" : "우측";
  const abs = Math.abs(angle);
  angleBadge.textContent = abs === 0 ? "축 안정" : `${dir}${abs}° 회전 발생`;
  blurLayer.style.setProperty("--blur", `${Math.max(0, abs) * 0.28}px`);
}
function stabilizeStep(){
  if (angle === 0) return;
  if (angle > 0) angle = Math.max(0, angle - 5);
  if (angle < 0) angle = Math.min(0, angle + 5);
  updateScene();
}
async function startRearCamera(){
  if (rearStream) return;
  rearStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:1280}}, audio:false });
  rearVideo.srcObject = rearStream;
  rearVideo.style.display = "block";
  capturedRear.style.display = "none";
}
function stopRearCamera(){
  if (rearStream){ rearStream.getTracks().forEach(t=>t.stop()); rearStream = null; }
  rearVideo.srcObject = null;
}
async function startFrontCamera(){
  if (frontStream) return;
  frontStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ideal:640}, height:{ideal:860}}, audio:false });
  frontVideo.srcObject = frontStream;
  frontInset.classList.add("show");
}
function stopFrontCamera(){
  if (frontStream){ frontStream.getTracks().forEach(t=>t.stop()); frontStream = null; }
  frontVideo.srcObject = null;
  frontInset.classList.remove("show");
}
function captureRearFrame(){
  const canvas = document.createElement("canvas");
  const w = rearVideo.videoWidth || 1080, h = rearVideo.videoHeight || 1080;
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(rearVideo, 0, 0, w, h);
  capturedRear.src = canvas.toDataURL("image/jpeg", .92);
  capturedRear.style.display = "block";
  rearVideo.style.display = "none";
}
function setManualModeUI(){
  autoMode = false;
  autoBtn.classList.remove("active");
  manualBtn.classList.add("primary");
  guide.classList.remove("show");
  if (autoTick){ clearInterval(autoTick); autoTick = null; }
  stopFrontCamera();
  capturedRear.style.display = "none";
  rearVideo.style.display = "block";
}
async function setAutoMode(){
  autoMode = true;
  manualBtn.classList.remove("primary");
  autoBtn.classList.add("active");
  guide.classList.add("show");
  captureRearFrame();
  await startFrontCamera();
  if (autoTick) clearInterval(autoTick);
  autoTick = setInterval(() => { if (autoMode) stabilizeStep(); }, 2200);
}

openDemo.addEventListener("click", async function(){
  overlay.classList.add("show");
  angle = -20;
  updateScene();
  try {
    await startRearCamera();
    setManualModeUI();
  } catch(e) {
    console.error(e);
    alert("카메라 권한을 허용해 주세요.");
  }
});
closeDemo.addEventListener("click", function(){
  overlay.classList.remove("show");
  if (autoTick){ clearInterval(autoTick); autoTick = null; }
  stopFrontCamera(); stopRearCamera();
});
rotateBtn.addEventListener("click", function(){ angle = randomAngle(); updateScene(); });
manualBtn.addEventListener("click", async function(){
  try {
    await startRearCamera();
    setManualModeUI();
    stabilizeStep();
  } catch(e) {
    console.error(e);
    alert("카메라 권한을 허용해 주세요.");
  }
});
autoBtn.addEventListener("click", async function(){
  try {
    await startRearCamera();
    if (!autoMode) await setAutoMode();
  } catch(e) {
    console.error(e);
    alert("카메라 권한을 허용해 주세요.");
  }
});
updateScene();
</script>
</body>
</html>
