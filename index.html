<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>ACUVUE ASD Blink Demo</title>
  <style>
    :root{
      --blue:#005EB8;
      --blue2:#1d74d1;
      --navy:#0d2742;
      --white:#fff;
      --soft:#eef6ff;
      --line:rgba(255,255,255,.28);
      --glass:rgba(10, 27, 46, .34);
      --shadow:0 16px 38px rgba(0,0,0,.18);
      --danger:#f86c6c;
      --ok:#23b26d;
      --warn:#ffb648;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;height:100%;background:#021120;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;color:#fff;}
    body{overflow:hidden;}

    #app{position:relative;width:100vw;height:100svh;background:#000;}

    video{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      background:#000;
      transform:scaleX(1);
    }
    video.front-mirror{ transform:scaleX(-1); }

    .topBar{
      position:absolute; left:0; right:0; top:0;
      z-index:30;
      padding:calc(env(safe-area-inset-top) + 16px) 16px 10px;
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      pointer-events:none;
    }
    .brandCard, .miniStatus{
      pointer-events:auto;
      background:linear-gradient(180deg, rgba(5,94,184,.92), rgba(2,52,105,.88));
      border:1px solid rgba(255,255,255,.22);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-radius:18px;
    }
    .brandCard{padding:14px 16px; max-width:min(74vw, 430px);}
    .brandTitle{font-size:16px; font-weight:800; letter-spacing:.02em;}
    .brandSub{margin-top:5px; font-size:12px; line-height:1.45; opacity:.95;}
    .miniStatus{padding:11px 12px; min-width:92px; text-align:center;}
    .miniStatus .k{font-size:11px; opacity:.82;}
    .miniStatus .v{font-size:14px; font-weight:800; margin-top:2px;}

    .centerGuide{
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      z-index:26;
      width:min(88vw, 480px);
      text-align:center;
      pointer-events:none;
    }
    .guideBubble{
      display:inline-block;
      padding:13px 16px;
      border-radius:18px;
      background:rgba(5, 15, 27, .48);
      border:1px solid rgba(255,255,255,.20);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:var(--shadow);
      font-size:15px; font-weight:700; line-height:1.45;
    }
    .guideBubble b{color:#89c5ff;}

    .bottomPanel{
      position:absolute; left:0; right:0; bottom:0;
      z-index:35;
      padding:10px 14px calc(env(safe-area-inset-bottom) + 18px);
      pointer-events:none;
    }
    .bottomPanelInner{
      pointer-events:auto;
      width:min(100%, 760px);
      margin:0 auto;
      background:linear-gradient(180deg, rgba(8,22,38,.42), rgba(7,18,31,.64));
      border:1px solid rgba(255,255,255,.15);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:var(--shadow);
      border-radius:24px;
      padding:14px;
    }
    .stateRow{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom:12px;
    }
    .stateBadge{
      display:inline-flex; align-items:center; gap:8px;
      min-height:36px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      font-size:13px; font-weight:700;
    }
    .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px rgba(255,182,72,.16);}
    .dot.ok{background:var(--ok); box-shadow:0 0 0 4px rgba(35,178,109,.16);}
    .dot.fail{background:var(--danger); box-shadow:0 0 0 4px rgba(248,108,108,.16);}

    .btnRow{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
    }
    button{
      appearance:none; border:0; outline:0; cursor:pointer;
      min-height:52px;
      border-radius:16px;
      padding:12px 12px;
      font-size:15px; font-weight:800;
      color:#fff;
      background:linear-gradient(180deg, #1f7ad8, #005EB8);
      box-shadow:0 12px 24px rgba(0,94,184,.24);
    }
    button.secondary{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); box-shadow:none;}
    button.warn{background:linear-gradient(180deg, #ff8f6e, #ff6d6d); box-shadow:0 12px 24px rgba(248,108,108,.24);}
    button:disabled{opacity:.45; cursor:not-allowed;}

    .subText{margin-top:10px;font-size:12px;line-height:1.45;color:rgba(255,255,255,.74);}

    .lensWrap{
      position:absolute; inset:0;
      z-index:18;
      pointer-events:none;
      transition:filter .55s ease, opacity .35s ease;
    }
    .lensWrap.blurStrong{ filter:blur(6px) saturate(.92); }
    .lensWrap.stabilized{ filter:blur(0px) saturate(1); }

    .simCore{
      position:absolute; left:50%; top:48%; transform:translate(-50%,-50%);
      width:min(78vw, 380px); aspect-ratio:1/1;
      pointer-events:none;
    }
    .focusHalo{
      position:absolute; inset:-10%;
      border-radius:50%;
      background:radial-gradient(circle, rgba(80,164,255,.16) 0%, rgba(80,164,255,.08) 30%, rgba(80,164,255,0) 70%);
      opacity:.9;
    }
    .lensGlass{
      position:absolute; inset:10%; border-radius:50%;
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.3), rgba(255,255,255,.12) 24%, rgba(124,188,255,.16) 44%, rgba(84,167,255,.05) 66%, rgba(84,167,255,.02) 100%);
      border:1.3px solid rgba(255,255,255,.55);
      box-shadow:inset 0 0 50px rgba(134,197,255,.20), inset 0 0 22px rgba(255,255,255,.14);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
    }
    .axisGroup{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      transform:rotate(var(--axis-angle, 18deg));
      transition:transform .65s cubic-bezier(.2,.9,.2,1);
    }
    .axisLine{
      position:absolute; width:78%; height:0;
      border-top:3px dashed rgba(255,255,255,.92);
      filter:drop-shadow(0 0 6px rgba(255,255,255,.45));
    }
    .axisLine.soft{
      width:82%; border-top-color:rgba(96,188,255,.82);
      transform:rotate(90deg);
      opacity:.28;
      filter:none;
    }
    .mark{
      position:absolute; width:18px; height:18px; border-radius:50%;
      background:#ff9800;
      box-shadow:0 0 0 4px rgba(255,152,0,.18), 0 0 10px rgba(255,152,0,.45);
      transition:transform .65s cubic-bezier(.2,.9,.2,1), opacity .25s ease;
    }
    .mark.left{ transform:translate(calc(-1 * var(--mark-x, 118px)), calc(-1 * var(--mark-y, 46px))); }
    .mark.right{ transform:translate(var(--mark-x, 118px), var(--mark-y, 46px)); }

    .blurLayer{
      position:absolute; inset:0; z-index:8; pointer-events:none;
      backdrop-filter:blur(var(--scene-blur, 4px));
      -webkit-backdrop-filter:blur(var(--scene-blur, 4px));
      background:radial-gradient(circle at center, rgba(255,255,255,.04) 0%, rgba(255,255,255,.01) 45%, rgba(0,0,0,.06) 100%);
      transition:backdrop-filter .65s ease, -webkit-backdrop-filter .65s ease, opacity .35s ease;
      opacity:1;
    }

    .transitionShade{
      position:absolute; inset:0; z-index:40; pointer-events:none;
      background:#020914;
      opacity:0;
      transition:opacity .22s ease;
    }
    .transitionShade.on{ opacity:.68; }

    .modePill{
      position:absolute; left:50%; transform:translateX(-50%);
      top:calc(env(safe-area-inset-top) + 96px);
      z-index:27;
      background:rgba(9,20,34,.48);
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      padding:8px 12px;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      font-size:12px; font-weight:800;
      color:rgba(255,255,255,.92);
      box-shadow:var(--shadow);
    }
    .modePill .rear{color:#86c5ff}
    .modePill .front{color:#ffd189}

    .hiddenCanvas{display:none;}

    @media (max-width: 520px){
      .brandTitle{font-size:15px}
      .brandSub{font-size:11px}
      .btnRow{grid-template-columns:1fr;}
      button{min-height:50px; font-size:15px;}
      .simCore{width:min(84vw, 350px);}
      .axisLine{border-top-width:2.4px;}
      .mark{width:16px;height:16px;}
      .modePill{top:calc(env(safe-area-inset-top) + 106px);}
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="video" playsinline autoplay muted></video>

    <div id="blurLayer" class="blurLayer"></div>

    <div id="lensWrap" class="lensWrap blurStrong">
      <div class="simCore" aria-hidden="true">
        <div class="focusHalo"></div>
        <div class="lensGlass"></div>
        <div id="axisGroup" class="axisGroup" style="--axis-angle:18deg; --mark-x:116px; --mark-y:44px;">
          <div class="axisLine"></div>
          <div class="axisLine soft"></div>
          <div class="mark left"></div>
          <div class="mark right"></div>
        </div>
      </div>
    </div>

    <div class="topBar">
      <div class="brandCard">
        <div class="brandTitle">ACUVUE ASD™ Blink Demo</div>
        <div class="brandSub">후방 카메라로 실제 배경을 보면서, 눈 깜박임 체험 시 전방 카메라로 잠깐 전환 후 안정화 효과를 보여주는 웹 버전입니다.</div>
      </div>
      <div class="miniStatus">
        <div class="k">현재 모드</div>
        <div id="miniMode" class="v">후방</div>
      </div>
    </div>

    <div class="modePill"><span class="rear">후방: 실제 배경</span> · <span class="front">전방: blink 감지</span></div>

    <div class="centerGuide">
      <div id="guideBubble" class="guideBubble">아래에서 <b>후방 카메라 시작</b>을 눌러주세요.</div>
    </div>

    <div class="bottomPanel">
      <div class="bottomPanelInner">
        <div class="stateRow">
          <div class="stateBadge"><span id="statusDot" class="dot"></span><span id="statusText">대기 중</span></div>
          <div class="stateBadge"><span>blink</span> <span id="blinkCount">0</span></div>
        </div>
        <div class="btnRow">
          <button id="btnRear">📸 후방 카메라 시작</button>
          <button id="btnBlink" class="warn" disabled>👁 눈으로 체험하기</button>
          <button id="btnManual" class="secondary" disabled>✨ 수동 안정화</button>
        </div>
        <div class="subText">
          GitHub Pages에 올리면 됩니다. 반드시 <b>HTTPS</b> 환경에서 열어야 카메라 권한이 정상 동작합니다. iPhone에서는 처음 한 번 카메라 권한 허용이 필요합니다.
        </div>
      </div>
    </div>

    <div id="transitionShade" class="transitionShade"></div>
    <canvas id="hiddenCanvas" class="hiddenCanvas"></canvas>
  </div>

  <script type="module">
    import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';

    const video = document.getElementById('video');
    const guideBubble = document.getElementById('guideBubble');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const miniMode = document.getElementById('miniMode');
    const blurLayer = document.getElementById('blurLayer');
    const lensWrap = document.getElementById('lensWrap');
    const axisGroup = document.getElementById('axisGroup');
    const transitionShade = document.getElementById('transitionShade');
    const blinkCountEl = document.getElementById('blinkCount');

    const btnRear = document.getElementById('btnRear');
    const btnBlink = document.getElementById('btnBlink');
    const btnManual = document.getElementById('btnManual');

    let currentStream = null;
    let currentMode = 'idle'; // idle | rear | front-detect
    let detectionActive = false;
    let faceLandmarker = null;
    let animationFrameId = null;
    let lastVideoTime = -1;
    let blinkCount = 0;
    let cooldownUntil = 0;
    let blinkState = 'open';
    let isSwitching = false;

    const EAR_CLOSE = 0.19;
    const EAR_OPEN = 0.235;
    const BLINK_COOLDOWN_MS = 900;

    function setGuide(msg){ guideBubble.innerHTML = msg; }
    function setMiniMode(txt){ miniMode.textContent = txt; }
    function setStatus(msg, type='idle'){
      statusText.textContent = msg;
      statusDot.className = 'dot';
      if(type === 'ok') statusDot.classList.add('ok');
      if(type === 'fail') statusDot.classList.add('fail');
    }

    function setSimState(stabilized){
      if(stabilized){
        axisGroup.style.setProperty('--axis-angle', '0deg');
        axisGroup.style.setProperty('--mark-y', '0px');
        lensWrap.classList.add('stabilized');
        lensWrap.classList.remove('blurStrong');
        blurLayer.style.setProperty('--scene-blur', '0px');
      } else {
        axisGroup.style.setProperty('--axis-angle', '18deg');
        axisGroup.style.setProperty('--mark-y', '44px');
        lensWrap.classList.add('blurStrong');
        lensWrap.classList.remove('stabilized');
        blurLayer.style.setProperty('--scene-blur', '4px');
      }
    }

    function updateBlinkCount(){ blinkCountEl.textContent = String(blinkCount); }

    async function ensureFaceLandmarker(){
      if(faceLandmarker) return faceLandmarker;
      setStatus('얼굴 인식 엔진 로딩 중…');
      setGuide('초기 로딩 중입니다. 잠시만 기다려주세요.');

      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1,
        minFaceDetectionConfidence: 0.5,
        minFacePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });
      return faceLandmarker;
    }

    async function stopCurrentStream(){
      if(currentStream){
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
      video.srcObject = null;
      video.classList.remove('front-mirror');
    }

    async function startCamera(mode='rear'){
      if(isSwitching) return;
      isSwitching = true;
      transitionShade.classList.add('on');

      try {
        cancelDetectionLoop();
        await stopCurrentStream();

        const constraints = {
          audio: false,
          video: {
            facingMode: mode === 'front' ? 'user' : { ideal: 'environment' },
            width: { ideal: mode === 'front' ? 640 : 1280 },
            height: { ideal: mode === 'front' ? 480 : 720 }
          }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
        if(mode === 'front') video.classList.add('front-mirror');

        await video.play();

        currentMode = mode === 'front' ? 'front-detect' : 'rear';
        setMiniMode(mode === 'front' ? '전방' : '후방');

        if(mode === 'rear'){
          setStatus('후방 카메라 실행 중', 'ok');
          setGuide('실제 배경을 보며 체험할 수 있습니다.<br><b>눈으로 체험하기</b>를 누르면 잠깐 전방 카메라로 전환됩니다.');
          btnBlink.disabled = false;
          btnManual.disabled = false;
        } else {
          setStatus('눈 깜박임 감지 중', 'ok');
          setGuide('정면을 보고 <b>눈을 한 번 깜박여 주세요.</b>');
        }
      } catch (error) {
        console.error(error);
        setStatus('카메라 시작 실패', 'fail');
        setGuide('카메라 권한을 허용했는지 확인해주세요.<br>iPhone에서는 Safari에서 열고 HTTPS 환경이어야 합니다.');
      } finally {
        setTimeout(() => {
          transitionShade.classList.remove('on');
          isSwitching = false;
        }, 220);
      }
    }

    function distance(a,b){
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function calculateEAR(landmarks, indices){
      const p1 = landmarks[indices.left];
      const p2 = landmarks[indices.right];
      const p3 = landmarks[indices.top];
      const p4 = landmarks[indices.bottom];
      const horizontal = distance(p1, p2);
      const vertical = distance(p3, p4);
      if(!horizontal) return 1;
      return vertical / horizontal;
    }

    function processBlink(ear){
      const now = performance.now();
      if(now < cooldownUntil) return false;

      if(blinkState === 'open' && ear < EAR_CLOSE){
        blinkState = 'closed';
      } else if(blinkState === 'closed' && ear > EAR_OPEN){
        blinkState = 'open';
        cooldownUntil = now + BLINK_COOLDOWN_MS;
        return true;
      }
      return false;
    }

    async function startDetectionLoop(){
      const landmarker = await ensureFaceLandmarker();
      detectionActive = true;
      blinkState = 'open';
      cooldownUntil = 0;
      lastVideoTime = -1;

      const loop = async () => {
        if(!detectionActive || currentMode !== 'front-detect') return;

        if(video.readyState >= 2){
          const nowMs = performance.now();
          if(video.currentTime !== lastVideoTime){
            lastVideoTime = video.currentTime;
            const result = landmarker.detectForVideo(video, nowMs);
            const landmarks = result.faceLandmarks?.[0];

            if(landmarks){
              const leftEAR = calculateEAR(landmarks, { left: 33, right: 133, top: 159, bottom: 145 });
              const rightEAR = calculateEAR(landmarks, { left: 362, right: 263, top: 386, bottom: 374 });
              const avgEAR = (leftEAR + rightEAR) / 2;

              setStatus('눈 깜박임 감지 중', 'ok');

              if(processBlink(avgEAR)){
                blinkCount += 1;
                updateBlinkCount();
                detectionActive = false;
                onBlinkDetected();
                return;
              }
            } else {
              setStatus('얼굴을 정면으로 맞춰주세요');
            }
          }
        }
        animationFrameId = requestAnimationFrame(loop);
      };

      loop();
    }

    function cancelDetectionLoop(){
      detectionActive = false;
      if(animationFrameId){
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    async function startBlinkExperience(){
      if(currentMode !== 'rear'){
        await startCamera('rear');
      }
      setStatus('전방 카메라로 전환 중…');
      setGuide('blink 감지를 위해 전방 카메라로 전환합니다.');
      await startCamera('front');
      await startDetectionLoop();
    }

    async function onBlinkDetected(){
      setStatus('깜박임 감지 완료', 'ok');
      setGuide('깜박임이 감지되었습니다.<br><b>실제 배경 화면으로 복귀합니다.</b>');
      await startCamera('rear');
      triggerStabilization(true);
    }

    function triggerStabilization(fromBlink = false){
      setStatus(fromBlink ? '축 안정화 완료' : '수동 안정화 완료', 'ok');
      setGuide(fromBlink
        ? '눈 깜박임 후 렌즈가 제자리를 찾는 느낌을 표현했습니다.'
        : '수동 버튼으로 안정화 효과를 실행했습니다.');

      setSimState(true);

      setTimeout(() => {
        setGuide('다시 체험하려면 <b>눈으로 체험하기</b>를 눌러주세요.');
      }, 1100);

      setTimeout(() => {
        setSimState(false);
        setStatus('다음 체험 대기 중');
      }, 2400);
    }

    btnRear.addEventListener('click', async () => {
      await startCamera('rear');
      setSimState(false);
    });

    btnBlink.addEventListener('click', async () => {
      btnBlink.disabled = true;
      btnManual.disabled = true;
      try {
        await startBlinkExperience();
      } finally {
        btnBlink.disabled = false;
        btnManual.disabled = false;
      }
    });

    btnManual.addEventListener('click', () => {
      triggerStabilization(false);
    });

    window.addEventListener('beforeunload', () => {
      cancelDetectionLoop();
      stopCurrentStream();
    });

    updateBlinkCount();
    setSimState(false);

    if(!navigator.mediaDevices?.getUserMedia){
      setStatus('이 브라우저는 카메라를 지원하지 않습니다.', 'fail');
      setGuide('최신 iPhone Safari 또는 Chrome 계열 브라우저에서 열어주세요.');
      btnRear.disabled = true;
    }
  </script>
</body>
</html>
