<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ASD 체험</title>
  <style>
    :root{
      --acuvue-blue:#005EB8;
      --acuvue-blue-deep:#004A93;
      --acuvue-line:#C9DDF3;
      --acuvue-bg:#EEF6FD;
      --white:#fff;
      --shadow:0 18px 34px rgba(0,74,147,.10);
      --shadow-btn:0 10px 18px rgba(0,94,184,.18);
      --text:#143A63;
      --sub:#8C9AB0;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Arial,sans-serif;background:var(--acuvue-bg);}
    body{display:flex;justify-content:center;align-items:flex-start}
    .app{
      width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(0,94,184,.07) 0%, rgba(0,94,184,0) 24%),
        radial-gradient(circle at 88% 90%, rgba(0,94,184,.05) 0%, rgba(0,94,184,0) 18%),
        linear-gradient(180deg,#F7FBFF 0%, #EEF6FD 44%, #EAF3FC 100%);
    }
    .app::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.58) 0%, rgba(255,255,255,0) 28%),linear-gradient(90deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 26%);
    }
    .topbar{position:relative;z-index:2;padding:16px 14px 8px;display:flex;justify-content:space-between;align-items:center}
    .homeBtn{
      border:none;background:rgba(255,255,255,.92);border:1.5px solid var(--acuvue-line);border-radius:999px;
      padding:10px 14px;color:var(--acuvue-blue);font-weight:800;font-size:13px;box-shadow:var(--shadow);text-decoration:none;
    }
    .shell{position:relative;z-index:1;padding:8px 14px 24px}
    .card{border-radius:34px;background:#fff;border:1.5px solid var(--acuvue-line);box-shadow:var(--shadow);overflow:hidden}
    .head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 18px 12px}
    .title{font-size:28px;line-height:1.05;font-weight:900;letter-spacing:-.05em;color:#1E2A44;margin:0}
    .sub{margin-top:6px;color:#A6B1C2;font-size:11px;letter-spacing:.14em;font-weight:800}
    .close{width:44px;height:44px;border-radius:50%;border:1.5px solid #E4E8EF;background:#F8FAFD;color:#9AA4B5;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;text-decoration:none}
    .sceneWrap{padding:0 14px}
    .scene{
      position:relative;border-radius:28px;overflow:hidden;background:#dbe8f7;aspect-ratio:1/1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
    }
    .baseBg,.captureBg,.rearVideo,.frontVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .baseBg{display:block}
    .rearVideo,.frontVideo,.captureBg{display:none}
    .scene.camera-on .rearVideo{display:block}
    .scene.auto-wait .captureBg{display:block}
    .scene.auto-wait .rearVideo{display:none}
    .scene.front-on .frontVideo{display:block}
    .scene.front-on .captureBg{display:none}
    .scene.front-on .rearVideo{display:none}
    .scene.front-on .baseBg{display:none}
    .scene.camera-on:not(.front-on):not(.auto-wait) .baseBg{display:none}
    .rearVideo,.captureBg{filter:blur(var(--blur, 2.4px)) saturate(.95)}
    .frontVideo{transform:scaleX(-1)}
    .overlayCircle{position:absolute;left:50%;top:52%;width:82%;height:82%;transform:translate(-50%,-50%) rotate(var(--axisDeg, -20deg));border-radius:50%;border:2px solid rgba(71,125,190,.32);transition:transform .45s ease, opacity .25s ease}
    .axisLine{position:absolute;left:11%;right:11%;top:50%;border-top:3px dashed rgba(68,67,73,.55);transform:rotate(var(--axisDeg, -20deg));transform-origin:center;transition:transform .45s ease}
    .guideSide{position:absolute;width:9%;height:17%;border-radius:999px;background:linear-gradient(180deg, rgba(34,211,238,.26), rgba(56,189,248,.14));box-shadow:inset 0 0 0 1px rgba(56,189,248,.14),0 0 14px rgba(14,165,233,.10);transition:all .45s ease}
    .leftSide{left:16%;top:51%;transform:translate(-50%,-50%) rotate(var(--axisDeg, -20deg))}
    .rightSide{left:84%;top:51%;transform:translate(-50%,-50%) rotate(var(--axisDeg, -20deg))}
    .dot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--dotColor,#F59E0B);box-shadow:0 0 0 8px rgba(245,158,11,.10),0 4px 10px rgba(245,158,11,.35);transition:all .45s ease}
    .dot.left{left:11%;top:50%;transform:translate(-50%,-50%)}
    .dot.right{left:89%;top:50%;transform:translate(-50%,-50%)}
    .badge{position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.92);color:#2563EB;border:1px solid rgba(59,130,246,.16);font-size:13px;font-weight:900;box-shadow:0 12px 30px rgba(15,23,42,.18)}
    .badge::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 5px rgba(59,130,246,.10)}
    .topPrompt,.frontPrompt{
      position:absolute;left:16px;top:16px;display:none;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.92);color:#2563EB;border:1px solid rgba(59,130,246,.20);font-size:13px;font-weight:900;box-shadow:0 12px 30px rgba(15,23,42,.12)
    }
    .topPrompt::before,.frontPrompt::before{content:"";width:10px;height:10px;border-radius:50%;background:#2563EB;box-shadow:0 0 0 5px rgba(59,130,246,.10)}
    .scene.auto-wait .topPrompt{display:inline-flex}
    .scene.front-on .frontPrompt{display:inline-flex}
    .eyeframe{position:absolute;left:50%;top:50%;width:62%;height:24%;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.68);border-radius:999px;display:none}
    .scene.front-on .eyeframe{display:block}
    .controls{padding:14px 14px 16px}
    .row{display:flex;gap:10px;align-items:center}
    .btn{flex:1;height:58px;border-radius:20px;border:1.5px solid #D9E4F2;background:#fff;color:#2563EB;font-size:16px;font-weight:900;box-shadow:0 8px 20px rgba(15,23,42,.08);cursor:pointer}
    .btn.primary{background:linear-gradient(180deg,#2F6BFF 0%, #245BDF 100%);color:#fff;border-color:#245BDF;box-shadow:var(--shadow-btn)}
    .btn.small{font-size:15px}
    .cameraBtn{flex:0 0 58px;width:58px;min-width:58px;padding:0;display:flex;align-items:center;justify-content:center}
    .cameraBtn svg{width:24px;height:24px;display:block}
    .cameraBtn.active{background:#EFF6FF;border-color:#BDD5FF}
    .hidden{display:none !important}
    .info{border-top:1px solid #E7EEF7;padding:18px 18px 14px;display:flex;gap:12px}
    .infoIcon{width:36px;height:36px;border-radius:12px;background:#EEF5FF;color:#3B82F6;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:0 0 36px}
    .infoText{min-width:0;flex:1}
    .infoTitle{font-size:16px;font-weight:900;line-height:1.35;color:#1E2A44;margin-bottom:4px}
    .infoBody{font-size:14px;line-height:1.6;color:#475569}
    .infoBody .blue{color:#2563EB;font-weight:800}
    .disc{padding:0 18px 18px;color:#65758B;font-size:10px;line-height:1.45}
    .blinkFlash{animation:blinkflash .34s ease}
    @keyframes blinkflash{0%{opacity:1}45%{opacity:.15}100%{opacity:1}}
    @media (max-width:390px){
      .shell{padding:6px 10px 20px}
      .head{padding:16px 16px 10px}
      .title{font-size:23px}
      .sceneWrap{padding:0 10px}
      .controls{padding:12px 10px 12px}
      .row{gap:8px}
      .btn{height:50px;font-size:13px;border-radius:16px}
      .cameraBtn{flex-basis:50px;width:50px;min-width:50px}
      .badge,.topPrompt,.frontPrompt{font-size:11px;padding:8px 11px}
      .info{padding:14px 14px 12px}
      .infoTitle{font-size:15px}
      .infoBody{font-size:13px}
      .disc{padding:0 14px 14px;font-size:9px}
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script>
    const scene = document.getElementById('scene');
    const rearVideo = document.getElementById('rearVideo');
    const frontVideo = document.getElementById('frontVideo');
    const captureBg = document.getElementById('captureBg');
    const angleBadge = document.getElementById('angleBadge');
    const basicRow = document.getElementById('basicRow');
    const cameraRow = document.getElementById('cameraRow');

    let currentAngle = -20;
    let rearStream = null;
    let frontStream = null;
    let faceMesh = null;
    let autoArmed = false;
    let blinkCooldown = false;
    let eyeClosed = false;
    let frontLoopStarted = false;

    function setAngle(deg) {
      currentAngle = Math.max(-30, Math.min(30, deg));
      scene.style.setProperty('--axisDeg', `${currentAngle}deg`);
      const stable = Math.abs(currentAngle) <= 0.1;
      const abs = Math.abs(Math.round(currentAngle));
      const txt = stable ? '축 안정' : `좌측 ${abs}° 회전 발생`;
      angleBadge.textContent = txt;
      scene.style.setProperty('--dotColor', stable ? '#22C55E' : '#F59E0B');
      const blur = stable ? '0px' : `${1.2 + abs * 0.12}px`;
      scene.style.setProperty('--blur', blur);
    }

    function randomRotate() {
      const choices = [-25, -20, -15, -10];
      setAngle(choices[Math.floor(Math.random()*choices.length)]);
    }

    function stabilizeStep() {
      if (currentAngle >= 0) return;
      setAngle(Math.min(0, currentAngle + 5));
      scene.classList.remove('blinkFlash');
      void scene.offsetWidth;
      scene.classList.add('blinkFlash');
    }

    async function startRearCamera() {
      stopRearCamera();
      rearStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal:'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio:false
      });
      rearVideo.srcObject = rearStream;
      await rearVideo.play().catch(()=>{});
    }

    function stopRearCamera() {
      if (rearStream) {
        rearStream.getTracks().forEach(t=>t.stop());
        rearStream = null;
      }
      rearVideo.srcObject = null;
    }

    async function enableCameraMode() {
      await startRearCamera();
      basicRow.classList.add('hidden');
      cameraRow.classList.remove('hidden');
      scene.classList.add('camera-on');
      scene.classList.remove('front-on','auto-wait');
    }

    async function disableCameraMode() {
      autoArmed = false;
      basicRow.classList.remove('hidden');
      cameraRow.classList.add('hidden');
      scene.classList.remove('camera-on','front-on','auto-wait');
      stopRearCamera();
      stopFrontCamera();
    }

    function captureRearFrame() {
      const canvas = document.createElement('canvas');
      const vw = rearVideo.videoWidth || 720;
      const vh = rearVideo.videoHeight || 720;
      canvas.width = vw; canvas.height = vh;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(rearVideo, 0, 0, vw, vh);
      captureBg.src = canvas.toDataURL('image/jpeg', .92);
      return captureBg.src;
    }

    async function startAutoFlow() {
      if (!rearStream) await startRearCamera();
      captureRearFrame();
      scene.classList.add('auto-wait');
      stopRearCamera();
      await startFrontCamera();
      autoArmed = true;
      scene.classList.remove('auto-wait');
      scene.classList.add('front-on','camera-on');
    }

    async function startFrontCamera() {
      stopFrontCamera();
      frontStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 960 } },
        audio:false
      });
      frontVideo.srcObject = frontStream;
      await frontVideo.play().catch(()=>{});
      if (!faceMesh) initFaceMesh();
      if (!frontLoopStarted) {
        frontLoopStarted = true;
        requestAnimationFrame(processFront);
      }
    }

    function stopFrontCamera() {
      if (frontStream) {
        frontStream.getTracks().forEach(t=>t.stop());
        frontStream = null;
      }
      frontVideo.srcObject = null;
      autoArmed = false;
      eyeClosed = false;
    }

    function initFaceMesh() {
      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({
        maxNumFaces:1,
        refineLandmarks:true,
        minDetectionConfidence:0.5,
        minTrackingConfidence:0.5
      });
      faceMesh.onResults(onFaceResults);
    }

    function dist(a,b) {
      const dx = a.x-b.x, dy = a.y-b.y;
      return Math.sqrt(dx*dx+dy*dy);
    }

    function eyeRatio(lms, idx) {
      const [left, right, top, bottom] = idx.map(i => lms[i]);
      return dist(top,bottom) / Math.max(dist(left,right), 0.0001);
    }

    async function processFront() {
      if (frontStream && faceMesh && frontVideo.readyState >= 2) {
        await faceMesh.send({ image: frontVideo });
      }
      requestAnimationFrame(processFront);
    }

    function onFaceResults(results) {
      if (!autoArmed || blinkCooldown) return;
      const lms = results.multiFaceLandmarks && results.multiFaceLandmarks[0];
      if (!lms) return;

      const leftEAR = eyeRatio(lms, [33,133,159,145]);
      const rightEAR = eyeRatio(lms, [362,263,386,374]);
      const avgEAR = (leftEAR + rightEAR) / 2;

      if (!eyeClosed && avgEAR < 0.16) {
        eyeClosed = true;
      } else if (eyeClosed && avgEAR > 0.23) {
        eyeClosed = false;
        blinkCooldown = true;
        stabilizeStep();
        if (Math.abs(currentAngle) <= 0.1) {
          setTimeout(async () => {
            stopFrontCamera();
            await startRearCamera();
            scene.classList.remove('front-on');
            scene.classList.add('camera-on');
          }, 220);
        }
        setTimeout(() => blinkCooldown = false, 700);
      }
    }

    document.getElementById('rotateBtn').addEventListener('click', randomRotate);
    document.getElementById('rotateBtn2').addEventListener('click', randomRotate);
    document.getElementById('blinkBtn').addEventListener('click', stabilizeStep);
    document.getElementById('manualBtn').addEventListener('click', stabilizeStep);
    document.getElementById('autoBtn').addEventListener('click', startAutoFlow);
    document.getElementById('cameraBtn').addEventListener('click', enableCameraMode);
    document.getElementById('cameraBtn2').addEventListener('click', disableCameraMode);

    setAngle(-20);
  </script>
</body>
</html>
