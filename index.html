<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASD Clean</title>
<style>
body{margin:0;font-family:-apple-system;background:#EEF5FD}
.wrap{max-width:420px;margin:auto;background:#fff;min-height:100vh}
.header{padding:20px;text-align:center;font-weight:800;color:#005EB8}
.start{padding:30px}
.start-card{background:#fff;border-radius:30px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.start h1{font-size:28px;margin:0 0 10px}
.btn{background:#005EB8;color:#fff;border:none;padding:18px;border-radius:20px;width:100%;font-size:18px;font-weight:700}

.sim{padding:16px}
.video{width:100%;border-radius:20px;overflow:hidden;position:relative}
video{width:100%;transform:scaleX(-1) scale(3.4) translate(-22%,-10%)}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#005EB8;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px}
.controls{display:flex;gap:10px;margin-top:10px}
.controls button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:700}
.primary{background:#005EB8;color:#fff}
.secondary{background:#E6EEF7}
</style>
</head>
<body>

<div class="wrap">

<div class="header">ASD 체험</div>

<div class="start" id="startScreen">
  <div class="start-card">
    <h1>난시 축 회전 체험</h1>
    <button class="btn" onclick="start()">체험 시작</button>
  </div>
</div>

<div class="sim" id="simScreen" style="display:none">
  <div class="video">
    <video id="video" autoplay playsinline></video>
    <div class="hint">눈을 깜박여주세요</div>
  </div>

  <div class="controls">
    <button class="secondary" onclick="randomRotate()">축이탈</button>
    <button class="primary" onclick="blink()">눈 깜박임</button>
  </div>
</div>

</div>

<script>
let angle = 20;
let stream;

async function start(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('simScreen').style.display='block';

  stream = await navigator.mediaDevices.getUserMedia({video:true});
  document.getElementById('video').srcObject = stream;

  randomRotate(); // 시작시 회전
}

function randomRotate(){
  const vals=[-25,-20,-15,-10,-5,5,10,15,20,25];
  angle = vals[Math.floor(Math.random()*vals.length)];
  console.log('회전',angle);
}

function blink(){
  if(angle>0) angle-=5;
  if(angle<0) angle+=5;
  console.log('보정',angle);
}
</script>

</body>
</html>
