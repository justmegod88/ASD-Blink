<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ASD 체험</title>
  <style>
    :root{
      --blue:#2563eb;
      --navy:#1e293b;
      --line:rgba(148,163,184,.2);
      --soft:#f8fbff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;background:linear-gradient(180deg,#dbeafe 0%,#eff6ff 35%,#f8fafc 100%);color:var(--navy)}
    body{overflow:hidden}
    .landing{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
    .launch{
      border:none;border-radius:26px;background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;
      min-width:min(82vw,320px);height:74px;font-size:24px;font-weight:900;letter-spacing:-.03em;
      box-shadow:0 20px 44px rgba(37,99,235,.28);cursor:pointer
    }
    .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(15,23,42,.26);backdrop-filter:blur(12px);z-index:20}
    .overlay.show{display:flex}
    .card{width:min(560px,97vw);border-radius:34px;background:#fff;overflow:hidden;box-shadow:0 30px 70px rgba(15,23,42,.22)}
    .head{display:flex;justify-content:space-between;align-items:center;padding:22px 18px 12px;background:#fff}
    .title{font-size:24px;font-weight:900;line-height:1.1;letter-spacing:-.03em}
    .sub{margin-top:4px;font-size:11px;color:#94a3b8;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .close{width:40px;height:40px;border:none;border-radius:999px;background:#f8fafc;color:#94a3b8;font-size:20px;font-weight:900;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(148,163,184,.18)}
    .scene{position:relative;width:calc(100% - 20px);margin:0 10px;aspect-ratio:1/1;min-height:340px;border-radius:28px;overflow:hidden;background:#dfe6ef}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#dfe6ef}
    #rearVideo{filter:blur(7px) saturate(.94) brightness(.92);transition:filter .35s ease, opacity .25s ease}
    #frontVideo{display:none}
    #capturedImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;filter:blur(7px) saturate(.92) brightness(.92);transition:filter .28s ease}
    .guideShade{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%, rgba(255,255,255,0) 40%, rgba(15,23,42,.16) 100%);pointer-events:none}
    .circle{position:absolute;left:50%;top:50%;width:80%;height:80%;transform:translate(-50%,-50%) rotate(var(--angle,20deg));border-radius:999px;border:2px solid rgba(71,125,190,.32);transition:transform .35s ease}
    .axis{position:absolute;left:10%;right:10%;top:50%;border-top:3px dashed rgba(68,67,73,.55);transform:rotate(var(--angle,20deg));transform-origin:center;transition:transform .35s ease}
    .side{position:absolute;width:9%;height:18%;border-radius:999px;background:linear-gradient(180deg, rgba(34,211,238,.28), rgba(56,189,248,.14));box-shadow:inset 0 0 0 1px rgba(56,189,248,.18),0 0 14px rgba(14,165,233,.10);transition:transform .35s ease,left .35s ease,top .35s ease}
    .side.left{left:18.5%;top:50%;transform:translate(-50%,-50%) rotate(var(--angle,20deg))}
    .side.right{left:81.5%;top:50%;transform:translate(-50%,-50%) rotate(var(--angle,20deg))}
    .dot{position:absolute;width:18px;height:18px;border-radius:999px;background:#f59e0b;box-shadow:0 0 0 8px rgba(245,158,11,.10),0 4px 10px rgba(245,158,11,.35);transition:left .35s ease, top .35s ease, background .35s ease, box-shadow .35s ease}
    .dot.left{left:10%;top:50%;transform:translate(-50%,-50%)}
    .dot.right{left:90%;top:50%;transform:translate(-50%,-50%)}
    .stable .dot{background:#22c55e;box-shadow:0 0 0 8px rgba(34,197,94,.12),0 4px 10px rgba(34,197,94,.3)}
    .badge{position:absolute;left:14px;bottom:14px;z-index:4;display:inline-flex;gap:8px;align-items:center;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.9);color:#2563eb;border:1px solid rgba(59,130,246,.16);font-size:14px;font-weight:900;box-shadow:0 12px 30px rgba(15,23,42,.16)}
    .badge::before{content:"";width:10px;height:10px;border-radius:999px;background:currentColor;box-shadow:0 0 0 5px rgba(59,130,246,.1)}
    .status{position:absolute;left:14px;top:14px;z-index:4;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.88);font-size:12px;font-weight:900;color:#1d4ed8;box-shadow:0 8px 18px rgba(15,23,42,.12)}
    .controls{display:grid;grid-template-columns:1fr 1fr 64px;gap:8px;padding:12px 10px;background:#fff}
    .btn{height:52px;border-radius:18px;border:1px solid rgba(148,163,184,.18);font-size:15px;font-weight:900;letter-spacing:-.02em;cursor:pointer;background:#fff;color:#1e293b;box-shadow:0 8px 20px rgba(15,23,42,.08)}
    .btn.primary{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 14px 26px rgba(37,99,235,.16)}
    .btn.active{background:#eff6ff;color:#2563eb}
    .camIcon{font-size:22px}
    .hint{display:flex;gap:12px;align-items:flex-start;padding:16px 14px 18px;background:rgba(248,250,252,.94);border-top:1px solid rgba(226,232,240,.92)}
    .info{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#eaf3ff;color:#3b82f6;font-weight:900;flex:0 0 auto}
    .hintTitle{font-size:16px;font-weight:900;margin-bottom:4px}
    .hintBody{font-size:14px;line-height:1.55;color:#475569}
    .blue{color:#2563eb;font-weight:800}
    .hiddenCanvas{display:none}
    @media (max-width:560px){
      .launch{height:68px;font-size:22px;min-width:78vw}
      .card{width:100%;border-radius:28px}
      .title{font-size:20px}
      .scene{min-height:320px}
      .controls{grid-template-columns:1fr 1fr 58px}
      .btn{height:48px;font-size:13px;border-radius:16px}
      .badge{font-size:11px;padding:8px 11px}
      .status{font-size:11px}
      .hintTitle{font-size:15px}
      .hintBody{font-size:13px}
    }
  </style>
</head>
<body>
  <div class="landing">
    <button id="openAsd" class="launch">ASD 체험</button>
  </div>

  <div id="asdOverlay" class="overlay">
    <div id="asdCard" class="card">
      <div class="head">
        <div>
          <div class="title">ASD™ 축안정화</div>
          <div class="sub">ACCELERATION STABLE DESIGN</div>
        </div>
        <button id="closeAsd" class="close">✕</button>
      </div>

      <div id="scene" class="scene">
        <video id="rearVideo" playsinline autoplay muted></video>
        <img id="capturedImage" alt="captured" />
        <video id="frontVideo" playsinline autoplay muted></video>
        <div class="guideShade"></div>
        <div id="sceneFrame">
          <div class="circle"></div>
          <div class="axis"></div>
          <div class="side left"></div>
          <div class="side right"></div>
          <div class="dot left"></div>
          <div class="dot right"></div>
        </div>
        <div id="status" class="status">후면 카메라 준비 중</div>
        <div id="angleBadge" class="badge">좌측 20° 회전 발생</div>
      </div>

      <div class="controls">
        <button id="rotateBtn" class="btn">축이탈</button>
        <button id="manualBtn" class="btn primary">깜박임 수동</button>
        <button id="autoBtn" class="btn">깜박임 자동인식</button>
      </div>

      <div class="hint">
        <div class="info">i</div>
        <div>
          <div class="hintTitle">눈 깜박임으로 축 안정화 체험</div>
          <div class="hintBody"><span class="blue">축이탈</span>으로 랜덤 회전 후, <span class="blue">깜박임 수동</span>은 1회당 5° 교정됩니다. <span class="blue">깜박임 자동인식</span>은 후면 화면을 캡처한 뒤 전면 카메라에서 눈 깜박임을 인식해 캡처 이미지를 흐림→선명으로 바꿉니다.</div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="snapCanvas" class="hiddenCanvas"></canvas>

  <script type="module">
    import vision from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const { FaceLandmarker, FilesetResolver } = vision;

    const openBtn = document.getElementById('openAsd');
    const closeBtn = document.getElementById('closeAsd');
    const overlay = document.getElementById('asdOverlay');
    const rearVideo = document.getElementById('rearVideo');
    const frontVideo = document.getElementById('frontVideo');
    const capturedImage = document.getElementById('capturedImage');
    const scene = document.getElementById('scene');
    const sceneFrame = document.getElementById('sceneFrame');
    const angleBadge = document.getElementById('angleBadge');
    const statusEl = document.getElementById('status');
    const rotateBtn = document.getElementById('rotateBtn');
    const manualBtn = document.getElementById('manualBtn');
    const autoBtn = document.getElementById('autoBtn');
    const snapCanvas = document.getElementById('snapCanvas');

    let rearStream = null;
    let frontStream = null;
    let currentAngle = 20;
    let autoMode = false;
    let detector = null;
    let detectLoopId = 0;
    let lastVideoTime = -1;
    let blinkState = 'open';
    let cooldown = false;
    let usingCaptured = false;

    function setAngle(angle){
      currentAngle = Math.max(0, Math.min(40, angle));
      sceneFrame.style.setProperty('--angle', `${currentAngle}deg`);
      angleBadge.textContent = currentAngle > 0 ? `좌측 ${currentAngle}° 회전 발생` : '축 안정화 완료';
      scene.classList.toggle('stable', currentAngle === 0);
      if(!autoMode && !usingCaptured){
        rearVideo.style.filter = currentAngle === 0 ? 'blur(0px) saturate(1) brightness(1)' : `blur(${Math.max(1.2, currentAngle/3)}px) saturate(.94) brightness(.92)`;
      }
      if(usingCaptured){
        capturedImage.style.filter = currentAngle === 0 ? 'blur(0px) saturate(1) brightness(1)' : `blur(${Math.max(1.2, currentAngle/3)}px) saturate(.92) brightness(.92)`;
      }
    }

    function randomRotate(){
      const candidates = [10,15,20,25,30,35];
      setAngle(candidates[Math.floor(Math.random()*candidates.length)]);
      statusEl.textContent = '축이탈 발생';
    }

    function manualBlinkStep(){
      if(currentAngle <= 0){
        statusEl.textContent = '이미 안정화됨';
        return;
      }
      setAngle(currentAngle - 5);
      statusEl.textContent = currentAngle === 0 ? '축 안정화 완료' : '수동 깜박임 인식';
    }

    async function startRearCamera(){
      if(rearStream) rearStream.getTracks().forEach(t=>t.stop());
      rearStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ideal:1280}, height:{ideal:720} }, audio:false });
      rearVideo.srcObject = rearStream;
      await rearVideo.play().catch(()=>{});
      rearVideo.style.display = 'block';
      rearVideo.style.opacity = '1';
      capturedImage.style.display = 'none';
      usingCaptured = false;
      setAngle(currentAngle);
      statusEl.textContent = '후면 카메라 활성화';
    }

    async function startFrontCamera(){
      if(frontStream) frontStream.getTracks().forEach(t=>t.stop());
      frontStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:960}, height:{ideal:720} }, audio:false });
      frontVideo.srcObject = frontStream;
      await frontVideo.play().catch(()=>{});
    }

    function stopFrontCamera(){
      if(frontStream){ frontStream.getTracks().forEach(t=>t.stop()); frontStream = null; }
      frontVideo.srcObject = null;
    }

    function captureRearFrame(){
      const w = rearVideo.videoWidth || 720;
      const h = rearVideo.videoHeight || 1280;
      snapCanvas.width = w;
      snapCanvas.height = h;
      const ctx = snapCanvas.getContext('2d');
      ctx.drawImage(rearVideo,0,0,w,h);
      capturedImage.src = snapCanvas.toDataURL('image/jpeg',0.92);
      capturedImage.style.display = 'block';
      rearVideo.style.display = 'none';
      usingCaptured = true;
      setAngle(currentAngle);
    }

    function eyeRatio(landmarks, ids){
      const p = id => landmarks[id];
      const dist = (a,b)=> Math.hypot(a.x-b.x, a.y-b.y);
      const vertical = (dist(p(ids[1]),p(ids[5])) + dist(p(ids[2]),p(ids[4]))) / 2;
      const horizontal = dist(p(ids[0]), p(ids[3]));
      return horizontal ? vertical / horizontal : 0;
    }

    async function ensureDetector(){
      if(detector) return detector;
      statusEl.textContent = '깜박임 인식 준비 중';
      const filesetResolver = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      detector = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
        },
        outputFaceBlendshapes: false,
        runningMode: 'VIDEO',
        numFaces: 1
      });
      return detector;
    }

    function onBlinkDetected(){
      if(cooldown) return;
      cooldown = true;
      manualBlinkStep();
      statusEl.textContent = currentAngle === 0 ? '자동 인식: 축 안정화 완료' : '자동 인식: 깜박임 감지';
      setTimeout(()=>{ cooldown = false; }, 900);
    }

    async function startAutoMode(){
      autoMode = true;
      autoBtn.classList.add('active');
      manualBtn.classList.remove('active');
      captureRearFrame();
      await startFrontCamera();
      await ensureDetector();
      blinkState = 'open';
      lastVideoTime = -1;
      statusEl.textContent = '전면 카메라에서 눈 깜박임 대기 중';
      runDetectionLoop();
    }

    async function stopAutoMode(){
      autoMode = false;
      autoBtn.classList.remove('active');
      cancelAnimationFrame(detectLoopId);
      stopFrontCamera();
      if(rearVideo.style.display === 'none'){
        rearVideo.style.display = 'block';
        capturedImage.style.display = 'none';
        usingCaptured = false;
        setAngle(currentAngle);
      }
      statusEl.textContent = '후면 카메라 활성화';
    }

    async function runDetectionLoop(){
      if(!autoMode || !detector || frontVideo.readyState < 2){
        detectLoopId = requestAnimationFrame(runDetectionLoop);
        return;
      }
      if(frontVideo.currentTime !== lastVideoTime){
        lastVideoTime = frontVideo.currentTime;
        const result = detector.detectForVideo(frontVideo, performance.now());
        if(result.faceLandmarks && result.faceLandmarks.length){
          const lm = result.faceLandmarks[0];
          const left = eyeRatio(lm, [33,160,158,133,153,144]);
          const right = eyeRatio(lm, [362,385,387,263,373,380]);
          const avg = (left + right) / 2;
          if(blinkState === 'open' && avg < 0.19){
            blinkState = 'closed';
          } else if(blinkState === 'closed' && avg > 0.23){
            blinkState = 'open';
            onBlinkDetected();
          }
        }
      }
      detectLoopId = requestAnimationFrame(runDetectionLoop);
    }

    openBtn.addEventListener('click', async ()=>{
      overlay.classList.add('show');
      if(!rearStream){
        try{
          await startRearCamera();
          randomRotate();
        }catch(err){
          statusEl.textContent = '카메라 권한을 허용해 주세요';
          console.error(err);
        }
      }
    });

    closeBtn.addEventListener('click', ()=>{
      overlay.classList.remove('show');
      stopAutoMode();
      if(rearStream){ rearStream.getTracks().forEach(t=>t.stop()); rearStream = null; }
      rearVideo.srcObject = null;
      rearVideo.style.display = 'block';
      capturedImage.style.display = 'none';
      usingCaptured = false;
      currentAngle = 20;
      setAngle(currentAngle);
      statusEl.textContent = '후면 카메라 준비 중';
    });

    rotateBtn.addEventListener('click', ()=>{
      if(!rearStream && !usingCaptured) return;
      randomRotate();
    });

    manualBtn.addEventListener('click', async ()=>{
      if(autoMode) await stopAutoMode();
      manualBtn.classList.add('active');
      manualBlinkStep();
    });

    autoBtn.addEventListener('click', async ()=>{
      if(autoMode){
        await stopAutoMode();
      } else {
        try{
          await startAutoMode();
        }catch(err){
          statusEl.textContent = '자동인식 준비 실패';
          console.error(err);
          await stopAutoMode();
        }
      }
    });

    setAngle(currentAngle);
  </script>
</body>
</html>
